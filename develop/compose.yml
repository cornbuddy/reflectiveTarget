---
services:

  cache:
    image: redis:8-alpine
    volumes:
      - cache:/data

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: &pgpassword password
      POSTGRES_USER: &pguser reflective_target
      POSTGRES_DB: &pgdatabase reflective_target
    volumes:
      - db:/var/lib/postgresql

  server:
    depends_on: [db, cache]
    build:
      context: ../server
    environment:
      ENVIRONMENT: development
      CACHE_ADDRESS: cache:6379
      PGPASSWORD: *pgpassword
      PGUSER: *pguser
      PGDATABASE: *pgdatabase
      PGHOST: db

  frontend:
    depends_on: [server]
    build:
      context: ../client
      args:
        - node_env=${NODE_ENV:-development}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8080:80

volumes:
  db:
  cache:
