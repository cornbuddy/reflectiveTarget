services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: &pgpassword password
      POSTGRES_USER: &pguser reflective_target
      POSTGRES_DB: &pgdatabase reflective_target
  server:
    depends_on: [db]
    build:
      context: ../server
    environment:
      PGPASSWORD: *pgpassword
      PGUSER: *pguser
      PGDATABASE: *pgdatabase
      PGHOST: db
  client:
    depends_on: [server]
    image: nginx:latest
    volumes:
      - ../client:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8080:80
