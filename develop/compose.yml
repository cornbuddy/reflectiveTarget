services:
  db:
    image: postgres:18-alpine
  server:
    depends_on: [db]
    build:
      context: ../server
  client:
    depends_on: [server]
    image: nginx:latest
    volumes:
      - ../client:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8080:80
